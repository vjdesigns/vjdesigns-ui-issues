name: Feature request
description: Suggest a new component, prop or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing requests](https://github.com/vjdesigns/vjdesigns-ui-issues/issues?q=is%3Aissue+label%3Aenhancement) first. If one exists, add a 👍 reaction instead of a new issue.
  - type: input
    id: component
    attributes:
      label: Component
      description: Existing component this relates to, or "New component".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you can't today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: The API, prop or behavior you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: checkboxes
    id: frameworks
    attributes:
      label: Frameworks this matters for
      options:
        - label: React
        - label: Angular
        - label: Vue
